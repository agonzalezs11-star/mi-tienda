{% extends "tienda/base.html" %}{% block contenido %}<section class="panel">
<h1>{{ titulo }}</h1><a class="btn" href="nuevo/">+ Registrar {{ titulo|slice:":-1" }}</a>
<table><thead><tr><th>ID</th><th>Información</th><th>Acciones</th></tr></thead><tbody>
{% for r in registros %}<tr><td>{{ r.id }}</td><td>{{ r }}</td><td><a href="{{ r.id }}/editar/">Editar</a> · <a href="{{ r.id }}/eliminar/">Eliminar</a></td></tr>
{% empty %}<tr><td colspan="3">Todavía no hay registros.</td></tr>{% endfor %}
</tbody></table></section>{% endblock %}
